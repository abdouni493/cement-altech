<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cement-store.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altech Production — Vente &amp; Fabrication de Ciment</title>
    <script>
      // Applique le thème enregistré avant le premier rendu (clair par défaut)
      (function () {
        try {
          var raw = localStorage.getItem('altech-theme');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
