<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>

  <!-- Inner Golden Ring -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Cement Mixer Drum Icon -->
  <g transform="translate(116, 100)" filter="url(#goldGlow)">
    <!-- Silo / Cement Mixer Tower Base -->
    <path d="M 60 270 L 220 270 L 250 310 L 30 310 Z" fill="url(#goldGrad)"/>
    <path d="M 90 120 L 190 120 L 230 250 L 50 250 Z" fill="url(#goldGrad)"/>
    <!-- Dome Top -->
    <path d="M 90 120 Q 140 60 190 120 Z" fill="url(#silverGrad)"/>
    <!-- Outlet Pipe -->
    <rect x="125" y="270" width="30" height="45" rx="6" fill="url(#silverGrad)"/>

    <!-- Decorative Bands & Stars -->
    <line x1="70" y1="180" x2="210" y2="180" stroke="#0c0a09" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="180" r="14" fill="url(#silverGrad)"/>
  </g>

  <!-- Golden Brand Accent Star -->
  <polygon points="256,65 264,85 285,85 268,98 274,118 256,105 238,118 244,98 227,85 248,85" fill="url(#goldGrad)"/>
</svg>
